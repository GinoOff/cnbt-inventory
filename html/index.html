<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNBT Inventory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="inventory-container" class="hidden">
        <!-- Top bar: hotbar only (sort/action buttons moved into panel header) -->
        <div id="top-bar">
            <div id="hotbar">
                <!-- Filled dynamically -->
            </div>
        </div>

        <div id="inventory-panels">
            <!-- Player inventory panel -->
            <div id="player-panel" class="inv-panel">
                <div class="panel-header">
                    <div class="panel-title-group">
                        <span class="panel-title">Your Locker</span>
                        <span class="panel-title-chevron">&#9662;</span>
                    </div>
                    <div class="panel-actions" id="sort-buttons">
                        <button class="panel-action-btn" id="btn-sort-v" title="Pack items">Pack items</button>
                        <button class="panel-action-btn" id="btn-sort-h" title="Sort items">Sort items</button>
                        <button class="panel-action-btn" id="btn-reset-filter" title="Reset filtering">Reset filtering</button>
                    </div>
                    <span id="player-weight" class="weight-info">0 / 0 g</span>
                </div>
                <div id="player-grid" class="grid-container"></div>

                <!-- Backpack section -->
                <div id="backpack-section">
                    <div id="backpack-slot-container">
                        <div class="panel-header">
                            <div class="panel-title-group">
                                <span class="panel-title">Backpack</span>
                            </div>
                        </div>
                        <div id="backpack-slot" class="backpack-drop-zone">
                            <span class="empty-text">Drag backpack here</span>
                        </div>
                    </div>
                    <div id="backpack-grid-container" class="hidden">
                        <div class="panel-header">
                            <div class="panel-title-group">
                                <span class="panel-title" id="backpack-label">Backpack</span>
                            </div>
                            <span id="backpack-weight" class="weight-info">0 / 0 g</span>
                        </div>
                        <div id="backpack-grid" class="grid-container"></div>
                    </div>
                </div>
            </div>

            <!-- External inventory panel (stash/vehicle/drop) -->
            <div id="external-panel" class="inv-panel hidden">
                <div class="panel-header">
                    <div class="panel-title-group">
                        <span class="panel-title" id="external-label">Storage</span>
                        <span class="panel-title-chevron">&#9662;</span>
                    </div>
                    <span id="external-weight" class="weight-info">0 / 0 g</span>
                </div>
                <div id="external-grid" class="grid-container"></div>
            </div>
        </div>
    </div>

    <!-- Context menu -->
    <div id="context-menu" class="hidden">
        <!-- Filled dynamically -->
    </div>

    <!-- Split dialog -->
    <div id="split-dialog" class="hidden">
        <div class="split-content">
            <h3>Split Stack</h3>
            <div class="split-info">
                <span id="split-item-name"></span>
                <span id="split-total"></span>
            </div>
            <input type="range" id="split-slider" min="1" max="1" value="1">
            <div class="split-counts">
                <span id="split-left">0</span>
                <span id="split-right">0</span>
            </div>
            <div class="split-buttons">
                <button id="split-confirm">Confirm</button>
                <button id="split-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="hidden">
        <div id="tooltip-name"></div>
        <div id="tooltip-desc"></div>
        <div id="tooltip-info"></div>
    </div>

    <!-- Drag ghost (absolutely positioned, moved via transform) -->
    <div id="drag-ghost" class="hidden"></div>

    <!-- Grid highlight overlay cells (reused pool) -->
    <div id="highlight-pool"></div>

    <!-- Gunsmith full-screen tactical overlay -->
    <div id="gunsmith-overlay" class="hidden">
        <!-- Smooth radial vignette darkening the edges (no hard borders) -->
        <div id="gunsmith-vignette"></div>

        <!-- Tactical corner brackets (HUD decoration) -->
        <div class="gs-corner gs-corner-tl"></div>
        <div class="gs-corner gs-corner-tr"></div>
        <div class="gs-corner gs-corner-bl"></div>
        <div class="gs-corner gs-corner-br"></div>

        <!-- Top bar: weapon title + close button -->
        <div id="gunsmith-topbar">
            <div id="gunsmith-title-block">
                <span id="gunsmith-category">WEAPON</span>
                <h1 id="gunsmith-title">WEAPON</h1>
                <div id="gunsmith-subtitle">GUNSMITH // MODIFICATIONS</div>
            </div>
            <button id="gunsmith-back-btn" class="gs-close-btn" title="Close">&times;</button>
        </div>

        <!-- Transparent viewport over the weapon area: captures mouse drag for rotation and wheel for zoom -->
        <div id="gunsmith-3d-viewport"></div>

        <!-- Floating attachment slot labels positioned absolute around the weapon -->
        <div id="gunsmith-slot-list"></div>

        <!-- Popup menu for click-to-attach (listing compatible items) -->
        <div id="gunsmith-slot-menu" class="hidden"></div>

        <!-- Bottom control hints -->
        <div id="gunsmith-hints">
            <div class="gs-hint"><kbd>LMB</kbd> drag to rotate</div>
            <div class="gs-hint"><kbd>WHEEL</kbd> zoom</div>
            <div class="gs-hint"><kbd>CLICK</kbd> slot to equip</div>
            <div class="gs-hint"><kbd>RMB</kbd> slot to remove</div>
        </div>
    </div>

    <script src="js/grid.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/gunsmith.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
